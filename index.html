 e.innerHTML='<span class="tag">'+(p.good?'✨ Good Fate':'☠ Doom Fate')+'</span><h3>'+(p.good?'Takdir baik singgah. Anugerah mana yang kau jatuhkan?':'Takdir buruk mengintai. Malapetaka mana yang kau jatuhkan?')+'</h3><div id="fo">'+p.l.map((x,i)=>'<button data-i="'+i+'"><b>'+x[0]+'</b><br><span class="hint">'+x[1]+'</span></button>').join('')+'</div>';
 e.onclick=q=>{const b=q.target.closest('button');if(b){e.style.display='none';g.doFate(+b.dataset.i)}}}
function endAsk(){const g=GM,e=document.getElementById('fate');if(!g||g.over||g.fp||g.ask)return;g.ask=1;g.fs=g.si;g.si=0;e.className='bx doom';e.style.display='block';
 e.innerHTML='<span class="tag">⚠ Akhiri Era?</span><h3>Akhiri permainan sekarang dan lihat ringkasan peradaban?</h3><button id="ey">Ya, akhiri</button> <button id="en">Lanjut main</button>';
 document.getElementById('ey').onclick=()=>{e.style.display='none';g.ask=0;g.finish('Diakhiri lebih awal oleh pemain')};document.getElementById('en').onclick=()=>{e.style.display='none';g.ask=0;g.si=g.fs}}
function showSplash(){const e=document.getElementById('ld'),t=document.getElementById('ldt');let done=0;
 const start=()=>{if(done)return;done=1;removeEventListener('pointerdown',start);removeEventListener('keydown',start);e.classList.add('out');setTimeout(()=>{e.classList.remove('on');showSetup()},650)};
 const go=()=>{t.innerHTML='DOOM CIVIL'.split('').map((c,i)=>'<span style="--i:'+i+'">'+(c===' '?'&nbsp;':c)+'</span>').join('');e.classList.remove('out');e.classList.add('on');setTimeout(()=>{addEventListener('pointerdown',start);addEventListener('keydown',start)},1600)};
 Promise.race([document.fonts&&document.fonts.load?document.fonts.load('900 40px "Cinzel Decorative"'):Promise.resolve(),new Promise(r=>setTimeout(r,1200))]).then(go,go)}
function showLoad(go){const e=document.getElementById('lg'),t0=Date.now();window.GAMEREADY=false;e.classList.remove('out');e.classList.add('on');setTimeout(go,900);
 const iv=setInterval(()=>{const el=Date.now()-t0;if(el>=2800&&window.GAMEREADY||el>15000){clearInterval(iv);e.classList.add('out');setTimeout(()=>e.classList.remove('on'),450)}},100)}
function showSetup(){
 const s=document.getElementById('setup'),_sd=(s.style.display='block'),op=(a,f)=>a.map((x,i)=>'<option value="'+i+'">'+f(x)+'</option>').join('');
 s.innerHTML='<span class="tag">Permainan Baru</span><h2>Doom Civil</h2><div class="row"><label>Populasi awal (2–60)<input id="iN" type="number" min="2" max="60" value="4"></label><label>Laki-laki (sisanya perempuan)<input id="iM" type="number" min="1" max="59" value="2"></label><label>Target main (tahun game)<input id="iH" type="number" min="5" max="1000" step="5" value="100"></label><label>Target maks populasi (10–400)<input id="iX" type="number" min="10" max="400" value="400"></label><label>Peta<select id="iP">'+op(MAPS,x=>x.n)+'</select><span class="hint" id="dP"></span><canvas id="mp" width="160" height="120" style="width:100%;margin-top:calc(.3*var(--q));image-rendering:pixelated;border:1px solid #8a6a3a"></canvas></label><label>Kecenderungan kemajuan<select id="iT">'+op(TEND,x=>x.n)+'</select><span class="hint" id="dT"></span></label><label>Terrain<select id="iTL"><option value="0">Prosedural (default)</option><option value="1">Tile map (uji coba)</option></select></label></div><div style="text-align:center;margin-top:calc(.8*var(--q))"><button id="go">Mulai Peradaban</button></div><div class="foot">Beta Version '+VERSION+' &copy; 2026 Monsta Media</div>';
 const $=i=>document.getElementById(i),ds=()=>{$('dP').textContent=MAPS[$('iP').value].d;drawMapPrev($('mp'),+$('iP').value);$('dT').textContent=TEND[$('iT').value].d};$('iP').onchange=$('iT').onchange=ds;ds();
 $('go').onclick=()=>{const N=cl(+$('iN').value|0||4,2,60),M=cl(+$('iM').value|0||1,1,N-1);CFG={pop:N,m:M,years:cl(+$('iH').value||100,5,1000),max:cl(+$('iX').value|0||400,10,400),map:+$('iP').value,tend:+$('iT').value,tile:$('iTL')?+$('iTL').value:0};
  MAP=MAPS[CFG.map];TD=TEND[CFG.tend];TR=pick(TRIBES);s.style.display='none';showLoad(()=>new Phaser.Game({type:Phaser.AUTO,parent:'g',width:W,height:H,pixelArt:true,backgroundColor:'#0f1a26',scale:{mode:Phaser.Scale.ENVELOP,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Game]}))};
}
showSplash();
</script></body></html>
