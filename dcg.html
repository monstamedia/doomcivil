<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
/* HOOK SPRITE: isi SPRITE_OVERRIDES[namaSheet]={src:'data:image/png;base64,...',cols:jumlahKolom,fy:titikKaki} dengan gambar ukuran asli (per frame cw x ch), urutan frame = urutan nama frame pada sheet. Contoh sheet: house, bld, fauna, props, crops, deer, hero_m, hero_f0..2, hero_r. Sheet tanpa override tetap digambar lewat kode. */
const SPRITE_OVERRIDES={};
const TILE_OVERRIDES={}; /* HOOK TILE: TILE_OVERRIDES[jenis]={src:'data:image/png;base64,...',n:jumlahVarian}; strip horizontal tile 16x16. jenis: water,sand,dirt,grass,rock,snow */
/* ERA_PACE: pengali ambang K semua teknologi. 1 = normal, 2 = zaman dua kali lebih lambat, .5 = dua kali lebih cepat */
const ERA_PACE=1;
const VERSION='v.11.511DEV';
/* ==== CORE ENGINE START =============================================== */
const CharacterBirth = (() => {
  const VERSION = '1.0.0';

  /* ---------- Seeded RNG: string -> hash -> mulberry32 ---------- */
  function xmur3(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
    return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
  function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function makeRng(str){
    const f = mulberry32(xmur3(String(str))());
    return {
      f,
      int:(n)=>(f()*n)|0,
      pick:(a)=>a[(f()*a.length)|0],
      chance:(p)=>f()<p,
      weighted:(o)=>{const ks=Object.keys(o);let t=0;ks.forEach(k=>t+=o[k]);let r=f()*t;for(const k of ks){r-=o[k];if(r<0)return k}return ks[ks.length-1]}
    };
  }

  /* ---------- Warna ---------- */
  const dk=(h,a=.78)=>'#'+[1,3,5].map(i=>Math.min(255,Math.round(parseInt(h.substr(i,2),16)*a)).toString(16).padStart(2,'0')).join('');
  function hslToHex(h,s,l){l/=100;const a=s*Math.min(l,1-l)/100;const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return`#${f(0)}${f(8)}${f(4)}`}
  const mutedColor=(rng,lo,hi)=>hslToHex(rng.int(360),30+rng.int(40),lo+rng.int(hi-lo));

  /* ---------- CONFIG (ubah = hasil birth code lama ikut berubah) ---------- */
  const CONFIG = {
    maleChance: .5,
    skins: ['#f6c79a','#e8b08a','#d9a066','#b9794a','#8a5a3a','#e3a886','#593a2b'],
    hairs: ['#2b1d14','#5a3a22','#8a5530','#c9a050','#d8d8d0','#a03a2a','#303a5a','#1e2430','#c25a3a','#e8d5a7'],
    hairStyles: { M:{short:.4,spiky:.35,bald:.25}, F:{long:.4,bun:.3,short:.3} },
    body: { none:.5, robe:.2, armor:.2, apron:.1 },                    // pakaian luar
    head: { none:.65, hat:.1, wizhat:.05, helm:.1, goggles:.1 },       // topi/kepala
    beardChance: .3,   // hanya pria
    packChance: .2,    // tas punggung
    topLight:   { M:[30,60], F:[30,70] },
    pantsLight: { M:[20,40], F:[20,50] },
    shoes: { M:['#d8d0c0','#4a3626'], F:['#e8e0d0','#5a4030'] }
  };

  /* ---------- Generator nama (silabel, asli, tanpa daftar karakter fiksi) ---------- */
  const NM = {
    germanic:{
      pre:{M:['Ger','Wil','Ald','Rud','Ott','Gun','Hein','Leo','Bern','Con','Sieg','Wolf','Ulr','Hug','Os','Ans','Det','Lud'],
           F:['Ade','Bri','Ger','Hil','Ing','Mat','Ot','Ros','Sig','Thea','Wil','Els','Ger','Am','Frei','Lui']},
      suf:{M:['bert','helm','ric','mar','win','olf','ard','mund','ger','fried','an','o','hard','bald'],
           F:['trud','hild','a','burg','linde','gard','rid','wyn','ke','la','ra','munda','lind']},
      sur:{pre:['Eisen','Stein','Schwarz','Weiss','Gold','Berg','Wald','Hof','Bach','Brand','Roth','Kess','Lang','Stark','Falk','Haupt'],
           suf:['berg','stein','mann','hoff','feld','bach','ner','er','ling','wald','schild','hammer']}
    },
    slavic:{
      pre:{M:['Bor','Mir','Rad','Vlad','Stan','Yar','Dra','Zdi','Bog','Lud','Voj','Vel','Kaz','Dob','Rat'],
           F:['Mil','Zla','Svet','Ves','Dra','Rad','Lyu','Nad','Ste','Bog','Vla','Mir']},
      suf:{M:['imir','slav','mir','ek','an','ko','omil','gor','ush','ik','ar','od','im'],
           F:['a','ka','mila','slava','ena','ina','ica','ya','omira','dana']},
      sur:{stem:['Volk','Kov','Petr','Mor','Zhel','Bor','Sokol','Kras','Gorn','Dub','Lis','Medved','Bel','Chern'],
           M:['ov','ski','ic','enko','ev','in'], F:['ova','ska','ic','enko','eva','ina']}
    },
    roman:{
      pre:{M:['Aur','Cass','Dom','Fab','Gai','Luc','Marc','Quint','Sev','Tit','Val','Aem','Cat','Pub','Sext'],
           F:['Aur','Cla','Fla','Iul','Liv','Luc','Oct','Pomp','Sab','Val','Aem','Corn','Tert']},
      suf:{M:['ius','us','ianus','o','ilius','inus','ax','anus'],
           F:['ia','illa','ina','ora','ana','a','ella']},
      sur:{list:['Rufus','Felix','Maximus','Priscus','Varro','Nerva','Crispus','Brutus','Gracchus','Lentulus','Naso','Cicero','Flaccus','Piso','Severus','Celer']}
    },
    mono:{
      on:['B','D','F','G','H','K','L','M','N','R','S','T','V','W','Z','Br','Dr','Gr','Kr','St','Sv','Vl','Tr','Kl'],
      vo:['a','e','i','o','u'],
      coM:['lf','rk','rt','ns','nd','x','k','d','t','ll','rn','ld','rs','ck','z','g','s','n','l'],
      coF:['n','v','s','ll','t','z','th','ss','nn','d','r','m','na','la','ra'],
      open:['ea','ae','ia','ie','a','e']
    }
  };
  const STYLES = ['germanic','slavic','roman','mono'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  const join = (a,b) => (a.slice(-1).toLowerCase()===b.charAt(0).toLowerCase() ? a + b.slice(1) : a + b);

  function makeName(rng, g, style, withSurname){
    if (style === 'mono'){
      const T = NM.mono; let n;
      if (g==='F' && rng.chance(.25)) n = rng.pick(T.on) + rng.pick(T.open);
      else n = rng.pick(T.on) + rng.pick(T.vo) + rng.pick(g==='M'?T.coM:T.coF);
      return cap(n);
    }
    const S = NM[style];
    const first = cap(join(rng.pick(S.pre[g]), rng.pick(S.suf[g])));
    if (!withSurname) return first;
    let last;
    if (style==='germanic') last = cap(join(rng.pick(S.sur.pre), rng.pick(S.sur.suf)));
    else if (style==='slavic') last = cap(join(rng.pick(S.sur.stem), rng.pick(S.sur[g])));
    else last = rng.pick(S.sur.list);
    return first + ' ' + last;
  }

  /* ---------- Birth code ----------  format:  seed[~g:M|F][~n:style][~s:1]  */
  const clean = s => String(s).replace(/~/g,'-');
  function buildCode(o){
    let c = clean(o.seed);
    if (o.gender === 'M' || o.gender === 'F') c += '~g:' + o.gender;
    if (o.style && o.style !== 'mixed') c += '~n:' + o.style;
    if (o.surname) c += '~s:1';
    return c;
  }
  function parseCode(code){
    const parts = String(code).split('~'), o = { seed: parts[0], gender:null, style:'mixed', surname:false };
    parts.slice(1).forEach(p => { const [k,v] = p.split(':'); if(k==='g') o.gender=v; else if(k==='n') o.style=v; else if(k==='s') o.surname = v==='1' });
    return o;
  }
  const randomSeed = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const hash36 = s => xmur3(s)().toString(36).padStart(7,'0');

  /* ---------- Inti kelahiran ---------- */
  function fromCode(code){
    const o = parseCode(code), rng = makeRng(code), C = CONFIG;
    const gender = o.gender || (rng.chance(C.maleChance) ? 'M' : 'F');
    const style = (o.style && o.style !== 'mixed' && NM[o.style]) ? o.style : rng.pick(STYLES);
    const name = makeName(rng, gender, style, o.surname);

    const hairStyle = rng.weighted(C.hairStyles[gender]);
    const skin = rng.pick(C.skins), hair = rng.pick(C.hairs);
    const top = mutedColor(rng, ...C.topLight[gender]);
    const pants = mutedColor(rng, ...C.pantsLight[gender]);
    const [shoe, shoeShade] = C.shoes[gender];

    const traits = [];
    const body = rng.weighted(C.body);
    if (body==='robe') traits.push({k:'robe', c:mutedColor(rng,20,50)});
    else if (body==='armor') traits.push({k:'armor', c:'#a8b0c0'});
    else if (body==='apron') traits.push({k:'apron', c:'#f0ead8'});
    const head = rng.weighted(C.head);
    if (head==='hat') traits.push({k:'hat', c:mutedColor(rng,20,40)});
    else if (head==='wizhat') traits.push({k:'wizhat', c:mutedColor(rng,10,30)});
    else if (head==='helm') traits.push({k:'helm', c:'#9aa4b8'});
    else if (head==='goggles') traits.push({k:'goggles', c:'#3ec8e8'});
    if (gender==='M' && rng.chance(C.beardChance)) traits.push({k:'beard', c: rng.chance(.75) ? hair : rng.pick(C.hairs)});
    if (rng.chance(C.packChance)) traits.push({k:'pack', c:null});

    return { id:'B-'+hash36(String(code)), code:String(code), name, gender, set:'GEN', origin:style,
             appearance:{ skin, hair, hairStyle, top, pants, shoe, shoeShade }, traits };
  }

  function generate(o = {}){
    return fromCode(buildCode({ seed: o.seed != null ? o.seed : randomSeed(), gender:o.gender, style:o.style, surname:o.surname }));
  }

  const signature = c => JSON.stringify([c.appearance, c.traits]);
  function batch(n, o = {}){
    const seed = o.seed != null ? o.seed : randomSeed(), unique = o.unique !== false;
    const out = [], names = new Set(), looks = new Set();
    for (let i = 0; i < n; i++){
      let c;
      for (let a = 0; a < 40; a++){
        c = generate({ gender:o.gender, style:o.style, surname:o.surname, seed: `${seed}:${i}` + (a ? '#'+a : '') });
        if (!unique || (!names.has(c.name) && !looks.has(signature(c)))) break;
      }
      names.add(c.name); looks.add(signature(c)); out.push(c);
    }
    return out;
  }

  /* ---------- Export (skema sama dengan asteria_characters.json) ---------- */
  function toJSON(chars){
    return { meta:{ library:'Asteria Character Library (Birth Engine export)', engine:VERSION, total:chars.length,
        sprite:{ frameSize:[18,23], directions:{0:'down',1:'up',2:'right',3:'left (mirror of 2)'}, frames:{0:'idle',1:'walk-A',3:'walk-B'}, walkSequence:[1,0,3,0] },
        traitKeys:{ goggles:'head', hat:'head', wizhat:'head', helm:'head', beard:'face', robe:'body', armor:'body', apron:'body', pack:'back' } },
      characters: chars };
  }

  /* ---------- Renderer sprite pixel 18x23 ---------- */
  const TRT = {
    goggles:[3,(r,dd,dy,p,c)=>{r(3,3+dy,10,2,'#2a2a38');if(dd==0)[4,9].forEach(x=>{r(x,2+dy,3,3,'#8a8e9e');r(x+1,3+dy,1,1,c);r(x,2+dy,1,1,'#e8ecf4')});else if(dd==2){r(3,2+dy,3,3,'#8a8e9e');r(4,3+dy,1,1,c);r(3,2+dy,1,1,'#e8ecf4')}}],
    pack:[1,(r,dd,dy)=>{if(dd==1){r(2,9+dy,12,2,'#6f8a6a');r(2,9+dy,12,1,'#8fae88');r(3,11+dy,10,7,'#8a5a34');r(3,11+dy,10,2,'#b88450');r(12,11+dy,1,7,'#5a3a20');r(7,13+dy,2,2,'#e0c060')}else if(dd==2){r(11,9+dy,4,2,'#6f8a6a');r(11,11+dy,4,7,'#8a5a34');r(11,11+dy,4,2,'#b88450');r(13,13+dy,1,2,'#e0c060')}else{r(1,12+dy,1,4,'#8a5a34');r(14,12+dy,1,4,'#8a5a34');r(5,12+dy,1,4,'#5a3a20');r(10,12+dy,1,4,'#5a3a20')}}],
    apron:[1,(r,dd,dy,p,c)=>{if(dd==0)r(5,13+dy,6,4,c);else if(dd==2)r(4,13+dy,3,4,c);else r(7,15+dy,2,1,c)}],
    robe:[1,(r,dd,dy,p,c)=>{r(3,14+dy,10,5,c);r(10,14+dy,3,5,dk(c));r(3,18,10,1,dk(c,.6))}],
    armor:[1,(r,dd,dy,p,c)=>{r(3,12+dy,3,2,c);r(10,12+dy,3,2,dk(c,.8));if(dd!=1)r(5,13+dy,6,3,c);r(5,13+dy,2,1,'#e8ecf4')}],
    beard:[2,(r,dd,dy,p,c)=>{if(dd==0){r(4,10+dy,8,3,c);r(6,12+dy,4,1,c)}else if(dd==2)r(3,10+dy,5,3,c)}],

/* ===================== AUDIO: BGM shuffle + SFX =====================
   Folder:  assets/bgm/  (musik, shuffle otomatis)   assets/sfx/  (click, notify, alert)
   Tidak ada file -> tidak ada suara & tidak ada error. */
const AUD={bgm:{on:true,vol:.32,list:[],bag:[],last:'',el:null,found:false,disc:false,dir:'assets/'},sfx:{on:true,vol:.55,pool:{},last:{},ready:false},unl:false};

const AUD_DIRS=['assets/','/assets/'],AUD_ISA=n=>/\.(mp3|ogg|m4a|wav|opus|flac|aac)$/i.test(n);
function audSave(){try{localStorage.setItem('dc_aud',JSON.stringify({bm:AUD.bgm.on,sx:AUD.sfx.on}))}catch(e){}}
function audProbe(url,ms){return new Promise(res=>{const a=new Audio();let done=0,t=0;const fin=ok=>{if(done)return;done=1;clearTimeout(t);a.onloadedmetadata=a.onerror=null;res(ok)};t=setTimeout(()=>fin(false),ms||2500);a.preload='metadata';a.onloadedmetadata=()=>fin(true);a.onerror=()=>fin(false);a.src=url})}
async function sfxLoad(){const S=AUD.sfx;for(const nm of ['click','notify','alert']){let found=null;for(const d of AUD_DIRS){for(const ex of ['mp3','ogg','wav','m4a']){const u=d+'sfx/'+nm+'.'+ex;if(await audProbe(u,1800)){found=u;break}}if(found)break}
  if(found)S.pool[nm]=[0,1,2,3].map(()=>{const x=new Audio(found);x.preload='auto';return x})}S.ready=true;audUi()}
function sfx(name){const S=AUD.sfx;if(!S.on)return;const p=S.pool[name]||(name==='alert'?S.pool.notify:null);if(!p)return;const now=performance.now(),cd=name==='click'?45:350;if(now-(S.last[name]||0)<cd)return;S.last[name]=now;
  const a=p.find(x=>x.paused||x.ended)||p[0];try{a.currentTime=0;a.volume=Math.min(1,S.vol*(name==='click'?.7:1));const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}
async function bgmDiscover(){const B=AUD.bgm;if(B.disc)return;B.disc=true;const names=new Set(),add=n=>{if(typeof n==='string'&&AUD_ISA(n))names.add(n.replace(/^.*\//,''))};
  /* 1) assets/bgm/playlist.js -> window.BGM_PLAYLIST=['a.mp3',...]  (aman untuk file://) */
  await new Promise(r=>{const s=document.createElement('script');s.src='assets/bgm/playlist.js';s.onload=()=>r();s.onerror=()=>r();document.head.appendChild(s)});
  if(Array.isArray(window.BGM_PLAYLIST))window.BGM_PLAYLIST.forEach(add);
  if(names.size)B.dir='assets/';
  /* 2) playlist.json, 3) directory listing dari server (python -m http.server, dll) */
  if(!names.size)for(const d of AUD_DIRS){try{const r=await fetch(d+'bgm/playlist.json',{cache:'no-cache'});if(r.ok){const j=await r.json();(Array.isArray(j)?j:(j.tracks||[])).forEach(add)}}catch(e){}
    try{const r=await fetch(d+'bgm/',{cache:'no-cache'});if(r.ok){const t=await r.text(),re=/href="([^"?#]+)"/gi;let m;while((m=re.exec(t)))add(decodeURIComponent(m[1]))}}catch(e){}
    if(names.size){B.dir=d;break}}
  /* 4) tebakan nama bgm01..bgm40 */
  if(!names.size)for(const d of AUD_DIRS){let miss=0;for(let i=1;i<=40&&miss<3;i++){const nn='bgm'+String(i).padStart(2,'0');let hit=false;for(const ex of ['mp3','ogg','m4a','wav']){if(await audProbe(d+'bgm/'+nn+'.'+ex,1800)){names.add(nn+'.'+ex);hit=true;break}}miss=hit?0:miss+1}if(names.size){B.dir=d;break}}

function bgmNext(){const B=AUD.bgm;if(!B.on||!B.found||!B.list.length)return;
  if(!B.bag.length){B.bag=B.list.slice();for(let i=B.bag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[B.bag[i],B.bag[j]]=[B.bag[j],B.bag[i]]}if(B.bag.length>1&&B.bag[B.bag.length-1]===B.last)B.bag.unshift(B.bag.pop())}
  const u=B.bag.pop();B.last=u;
  if(!B.el){B.el=new Audio();B.el.preload='auto';B.el.onended=()=>bgmNext();B.el.onerror=()=>{B.list=B.list.filter(x=>x!==B.last);B.bag=B.bag.filter(x=>x!==B.last);if(!B.list.length){B.found=false;audUi();return}setTimeout(bgmNext,250)}}

function bgmToggle(){const B=AUD.bgm;B.on=!B.on;if(!B.on){if(B.el)B.el.pause()}else if(B.el&&B.el.src){const p=B.el.play();if(p&&p.catch)p.catch(()=>{});bgmFade(B.vol)}else bgmNext();audSave();audUi()}
function sfxToggle(){AUD.sfx.on=!AUD.sfx.on;audSave();audUi();if(AUD.sfx.on)sfx('click')}
function audUi(){const $=i=>document.getElementById(i),b=$('bgb'),s=$('sxb');if(b){b.textContent=AUD.bgm.on?'🎵':'🔇';b.style.opacity=(AUD.bgm.disc&&!AUD.bgm.found)?.45:1;b.title=(AUD.bgm.disc&&!AUD.bgm.found)?'Tidak ada BGM di assets/bgm/':'Musik: '+(AUD.bgm.on?'nyala':'mati')}if(s){s.textContent=AUD.sfx.on?'🔊':'🔈';s.title='Efek suara: '+(AUD.sfx.on?'nyala':'mati')}}
function audBind(){const $=i=>document.getElementById(i);if($('bgb'))$('bgb').onclick=bgmToggle;if($('sxb'))$('sxb').onclick=sfxToggle;if($('blb'))$('blb').onclick=()=>blExport(GM);audUi()}
addEventListener('pointerdown',e=>{audUnlock();sfx('click')},true);addEventListener('keydown',()=>audUnlock(),true);
